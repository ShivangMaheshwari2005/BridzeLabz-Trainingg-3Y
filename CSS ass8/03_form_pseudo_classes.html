<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pseudo-Class Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 30px;
        }

        form {
            width: 300px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            border: 2px solid #ccc;
            border-radius: 4px;
            outline: none;
        }

        input:focus {
            border-color: dodgerblue;
        }

        input:required {
            border-left: 4px solid red;
        }

        input:valid {
            border-color: green;
        }

        input:invalid {
            border-color: red;
        }

        input[type="checkbox"]:checked + label {
            color: green;
            font-weight: bold;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 8px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <form>
        <label for="name">Name (required):</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="example@mail.com">

        <input type="checkbox" id="agree">
        <label for="agree">I agree</label>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
