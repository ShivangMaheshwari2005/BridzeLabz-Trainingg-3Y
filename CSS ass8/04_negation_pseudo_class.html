<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:not() Pseudo-Class Example</title>
    <style>
        div {
            width: 200px;
            padding: 10px;
            margin: 8px;
            text-align: center;
            border: 2px solid #999;
        }

        div:not(.special) {
            background-color: red;
        }
    </style>
</head>
<body>
    <h2>:not() Pseudo-Class Example</h2>

    <div>Box 1</div>
    <div class="special">Box 2 (special)</div>
    <div>Box 3</div>
</body>
</html>
