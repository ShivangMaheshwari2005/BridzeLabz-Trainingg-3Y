<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Center an Image</title>
    <style>
        img {
            display: block;
            margin: auto;
            width: 20%;
        }
    </style>
</head>
<body>
    <h2>Center an Image Horizontally</h2>

    <p>
        To center an image horizontally, set margin to auto,
        convert it into a block element, and define a width.
    </p>

    <img
        src="https://fastly.picsum.photos/id/237/200/300.jpg"
        alt="Sample image">
</body>
</html>
