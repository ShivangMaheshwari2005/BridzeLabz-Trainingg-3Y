<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width Practice</title>

    <link rel="stylesheet" href="q2.css">
</head>

<body>

    <div class="container">

        <div class="box box1">
            <p>
                Width: 200px<br>
                Height: 200px
            </p>
        </div>

        <div class="box box2">
            <p>
                Width: 25%<br>
                Height: 15em<br>
                Min-height: 150px
            </p>
        </div>

        <div class="box box3">
            <p>
                Width: 30%<br>
                Height: 30vh<br>
                Max-width: 300px<br>
                Overflow: auto
            </p>
        </div>

    </div>

</body>
</html>
