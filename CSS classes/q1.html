<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding</title>

    <link rel="stylesheet" href="q1.css">
</head>

<body>

    <h1>Borders and Padding Demonstration</h1>

    <div class="container">

        <div class="box solid">
            <h2>Solid</h2>
            <p>Solid border with 20px padding.</p>
        </div>

        <div class="box dashed">
            <h2>Dashed</h2>
            <p>Dashed border with 30px padding.</p>
        </div>

        <div class="box double">
            <h2>Double</h2>
            <p>Double border with 15px padding.</p>
        </div>

        <div class="box groove">
            <h2>Groove</h2>
            <p>Groove border with 25px padding.</p>
        </div>

        <div class="box rounded">
            <h2>Rounded</h2>
            <p>Rounded corners using border-radius.</p>
        </div>

    </div>

</body>
</html>
