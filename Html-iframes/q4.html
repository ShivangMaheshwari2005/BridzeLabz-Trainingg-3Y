<!DOCTYPE html>
<html>
<head><title>Frameset Website</title></head>
<!-- Frameset divides the page into top and bottom frames -->
<frameset rows="30%,70%">
    <!-- Top frame contains navigation -->
    <frame src="navigation.html" name="navigation">
    <!-- Bottom frame displays welcome message -->
    <frame src="welcome.html" name="content">
</frameset>
</html>
