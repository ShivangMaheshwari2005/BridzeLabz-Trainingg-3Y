<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Map</title>
</head>
<body>
    <h1>My City Map</h1>
    <!-- loading="lazy" delays loading until the iframe is close to the visible area -->
    <iframe src="https://www.google.com/maps?q=Mathura,Uttar%20Pradesh&output=embed" title="Google Map of Mathura" width="600" height="450" loading="lazy"></iframe>
</body>
</html>
