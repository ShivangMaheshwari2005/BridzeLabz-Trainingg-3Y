<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Quotations</title></head>
<body>
    <h1>HTML Quotations</h1>
    <!-- Long quotation -->
    <blockquote>
        Learning HTML is an important first step in understanding how web pages are created.
        HTML provides the structure and meaning of content on a webpage using different elements
        and tags such as &lt;p&gt; and &amp;.
    </blockquote>
    <!-- Short quotation -->
    <p>My teacher always says, <q>Practice makes you better.</q></p>
</body>
</html>
