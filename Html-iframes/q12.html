<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>HTML Entities</title></head>
<body>
    <h1>HTML Entities</h1>
    <p>
        Less than: &lt;<br>
        Greater than: &gt;<br>
        Ampersand: &amp;<br>
        Double quotation: &quot;<br>
        Single quotation: &apos;<br>
        Copyright: &copy;<br>
        Trademark: &trade;<br>
        Registered Trademark: &reg;
    </p>
</body>
