<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Form Submission</title></head>
<body>
    <h1>Simple Form</h1>
    <form action="result.html" method="get" target="resultFrame">
        <label for="name">Enter Your Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>
        <input type="submit" value="Submit">
    </form>
    <br>
    <!-- Result page will load inside this iframe after submission -->
    <iframe name="resultFrame" width="80%" height="200" title="Result"></iframe>
</body>
</html>
