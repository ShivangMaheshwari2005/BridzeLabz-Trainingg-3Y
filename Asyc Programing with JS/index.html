<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 6 - Product Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f4f5f8;
            color: #202333;
        }
        h1 { text-align: center; }
        #product-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-top: 24px;
        }
        .product-card {
            padding: 18px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
            overflow-wrap: anywhere;
        }
        .product-card img {
            display: block;
            width: 100%;
            height: 170px;
            object-fit: contain;
            margin-bottom: 14px;
        }
        .product-card h3 { font-size: 16px; }
        .image-url { font-size: 12px; color: #555; }
        #error-message { color: #c62828; text-align: center; }
    </style>
</head>
<body>
    <h1>Fake Store Product Dashboard</h1>
    <p id="error-message" role="alert"></p>
    <main id="product-container">Loading products...</main>

    <!-- Q6 JavaScript file -->
    <script src="Q6_product_fetcher.js"></script>
</body>
</html>
