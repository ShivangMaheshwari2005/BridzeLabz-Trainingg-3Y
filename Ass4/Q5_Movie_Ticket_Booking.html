<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q5 - Movie Ticket Booking</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 520px; margin: 30px auto; padding: 0 16px; }
    label { display: block; margin-top: 12px; }
    input { box-sizing: border-box; width: 100%; padding: 9px; }
    .error { color: #c62828; }
    #ticket { margin-top: 18px; padding: 12px; border: 1px solid #888; }
  </style>
</head>
<body>
  <h1>Movie Ticket Booking</h1>
  <form id="bookingForm" novalidate>
    <label for="name">Name</label><input id="name">
    <div class="error" id="nameError"></div>
    <label for="email">Email</label><input id="email" type="email">
    <div class="error" id="emailError"></div>
    <label for="seats">Seats (1–10)</label><input id="seats" type="number" min="1" max="10">
    <div class="error" id="seatsError"></div>
    <button type="submit">Book Tickets</button>
  </form>
  <div id="ticket" hidden></div>
  <script src="Q5_Movie_Ticket_Booking.js"></script>
</body>
</html>
