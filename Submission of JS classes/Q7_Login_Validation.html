<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q7 - Login Validation</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 30px auto; padding: 0 16px; }
    label { display: block; margin-top: 12px; }
    input { box-sizing: border-box; width: 100%; padding: 9px; }
    .error { color: #c62828; }
  </style>
</head>
<body>
  <h1>Login Form Validation</h1>
  <form id="loginForm" novalidate>
    <label for="username">Username</label><input id="username">
    <div id="usernameError" class="error"></div>
    <label for="password">Password</label><input id="password" type="password">
    <div id="passwordError" class="error"></div>
    <button type="submit">Login</button>
  </form>
  <p id="result" aria-live="polite"></p>
  <script src="Q7_Login_Validation.js"></script>
</body>
</html>
