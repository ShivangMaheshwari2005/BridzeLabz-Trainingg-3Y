<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q9 - Shopping Cart</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 560px; margin: 30px auto; padding: 0 16px; }
    label { display: block; margin-top: 12px; }
    input { box-sizing: border-box; width: 100%; padding: 9px; }
    button { margin-top: 14px; padding: 9px 14px; }
    .error { color: #c62828; }
  </style>
</head>
<body>
  <h1>Shopping Cart</h1>
  <h2>Add Item</h2>
  <form id="itemForm">
    <label for="itemName">Item name</label><input id="itemName" required>
    <label for="itemPrice">Price (₹)</label><input id="itemPrice" type="number" min="0.01" step="0.01" required>
    <label for="quantity">Quantity</label><input id="quantity" type="number" min="1" step="1" required>
    <button type="submit">Add Item</button>
  </form>
  <h2>Cart Items</h2>
  <ul id="cartItems"></ul>
  <p id="subtotal">Subtotal: ₹0.00</p>
  <form id="couponForm">
    <label for="coupon">Coupon (e.g., SAVE20 or DISC10)</label><input id="coupon">
    <button type="submit">Apply Coupon</button>
  </form>
  <p id="couponMessage" class="error"></p>
  <p id="finalTotal">Final total: ₹0.00</p>
  <script src="Q9_Shopping_Cart.js"></script>
</body>
</html>
