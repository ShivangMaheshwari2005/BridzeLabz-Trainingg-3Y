<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pricing {
            width: 90%;
            max-width: 1100px;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .card {
            flex: 1;
            min-height: 350px;

            background-color: white;
            padding: 40px 25px;

            border-radius: 12px;
            text-align: center;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            transition: transform 0.3s ease;

            /* Fade-in animation */
            animation: fadeIn 1s ease-in;
        }

        /* Middle card */
        .card.middle {
            transform: scale(1.08);
            background-color: #dff0ff;
        }

        .card h2 {
            margin-bottom: 20px;
        }

        .price {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .card ul {
            list-style: none;
            line-height: 2;
        }

        /* Hover */
        .card:hover {
            transform: translateY(-10px);
        }

        .card.middle:hover {
            transform: scale(1.08) translateY(-10px);
        }

        /* Fade-in animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile */
        @media (max-width: 750px) {
            body {
                padding: 30px 0;
            }

            .pricing {
                flex-direction: column;
            }

            .card {
                width: 90%;
            }

            .card.middle {
                transform: none;
            }

            .card.middle:hover {
                transform: translateY(-10px);
            }
        }
    </style>
</head>

<body>

    <section class="pricing">

        <div class="card">
            <h2>Basic</h2>
            <div class="price">₹499</div>

            <ul>
                <li>✔ 5 Projects</li>
                <li>✔ Basic Support</li>
                <li>✔ 5 GB Storage</li>
            </ul>
        </div>

        <div class="card middle">
            <h2>Premium</h2>
            <div class="price">₹999</div>

            <ul>
                <li>✔ 20 Projects</li>
                <li>✔ Priority Support</li>
                <li>✔ 50 GB Storage</li>
            </ul>
        </div>

        <div class="card">
            <h2>Enterprise</h2>
            <div class="price">₹1999</div>

            <ul>
                <li>✔ Unlimited Projects</li>
                <li>✔ 24/7 Support</li>
                <li>✔ 200 GB Storage</li>
            </ul>
        </div>

    </section>

</body>
</html>
