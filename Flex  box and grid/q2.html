<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Gallery</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background-color: white;
            padding: 30px 20px;
            border-radius: 10px;

            /* Equal height */
            min-height: 180px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card h2 {
            margin-bottom: 15px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }

        /* Tablet */
        @media (max-width: 900px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Product Gallery</h1>

    <div class="gallery">

        <div class="card">
            <h2>Laptop</h2>
            <p class="price">₹50,000</p>
        </div>

        <div class="card">
            <h2>Smartphone</h2>
            <p class="price">₹25,000</p>
        </div>

        <div class="card">
            <h2>Headphones</h2>
            <p class="price">₹3,000</p>
        </div>

        <div class="card">
            <h2>Keyboard</h2>
            <p class="price">₹2,000</p>
        </div>

        <div class="card">
            <h2>Mouse</h2>
            <p class="price">₹1,000</p>
        </div>

        <div class="card">
            <h2>Monitor</h2>
            <p class="price">₹15,000</p>
        </div>

        <div class="card">
            <h2>Tablet</h2>
            <p class="price">₹20,000</p>
        </div>

        <div class="card">
            <h2>Smartwatch</h2>
            <p class="price">₹5,000</p>
        </div>

    </div>

</body>
</html>
