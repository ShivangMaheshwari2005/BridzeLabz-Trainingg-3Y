<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Notifications Dashboard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="style6.css"></head>
<body class="bg-light"><main class="container py-5"><div class="card shadow-sm mx-auto dashboard-card"><div class="card-header bg-dark text-white"><h1 class="h3 mb-0">Notifications Dashboard</h1></div>
<div class="card-body p-4"><div class="alert alert-success" role="alert"><strong>New Message:</strong> Your project report was approved.</div><div class="alert alert-info" role="alert"><strong>Tip:</strong> Complete your profile to unlock more features.</div><div class="alert alert-danger" role="alert"><strong>Warning:</strong> Your password will expire soon.</div>
<div class="alert alert-warning alert-dismissible fade show" role="alert"><strong>Reminder:</strong> Your subscription renews tomorrow.<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button></div>
<section class="summary p-4 mt-4 bg-light border rounded"><h2 class="h4">Summary</h2><div class="row text-center g-3 mt-1"><div class="col-4"><h3>12</h3><small>Notifications</small></div><div class="col-4"><h3>5</h3><small>Messages</small></div><div class="col-4"><h3>3</h3><small>Warnings</small></div></div></section></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
