<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Task Tracker</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="style7.css"></head>
<body class="bg-light"><main class="container py-5"><section class="card shadow-sm mx-auto task-card"><header class="card-header d-flex justify-content-between align-items-center"><h1 class="h3 mb-0">Task Tracker</h1><span class="badge text-bg-primary">4 Pending</span></header>
<div class="card-body p-0"><div class="list-group list-group-flush"><div class="list-group-item d-flex justify-content-between align-items-center"><span>Complete AI assignment</span><span class="badge text-bg-danger">High</span></div><div class="list-group-item d-flex justify-content-between align-items-center"><span>Prepare Java practice</span><span class="badge text-bg-warning">Medium</span></div><div class="list-group-item d-flex justify-content-between align-items-center"><span>Update portfolio</span><span class="badge text-bg-success">Low</span></div><div class="list-group-item d-flex justify-content-between align-items-center"><span>Review Bootstrap notes</span><span class="badge text-bg-warning">Medium</span></div></div></div>
<footer class="card-footer text-end"><button class="btn btn-success">Completed <span class="badge text-bg-light text-success">3</span></button></footer></section></main></body></html>
