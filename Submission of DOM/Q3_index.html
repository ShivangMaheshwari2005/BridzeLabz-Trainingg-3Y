<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Step Form</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Registration Form</h1>
    <p id="step-label">Step 1 of 3</p>
    <form id="multi-step-form" novalidate>
      <section class="form-step active" data-step="0">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name">
        <p class="error" id="name-error"></p>
      </section>
      <section class="form-step" data-step="1">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email">
        <p class="error" id="email-error"></p>
      </section>
      <section class="form-step" data-step="2">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password">
        <p class="error" id="password-error"></p>
      </section>
      <div class="actions">
        <button id="back-button" type="button" disabled>Back</button>
        <button id="next-button" type="button">Next</button>
      </div>
    </form>
    <section id="summary" hidden>
      <h2>Registration Summary</h2>
      <p id="summary-content"></p>
      <button id="restart-button" type="button">Start Again</button>
    </section>
  </main>
</body>
</html>
