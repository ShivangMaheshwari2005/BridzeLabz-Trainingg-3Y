<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Character Counter</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Live Character Counter</h1>
    <label for="message-input">Your message (maximum 100 characters)</label>
    <textarea id="message-input" maxlength="100" placeholder="Start typing..."></textarea>
    <p id="counter" aria-live="polite">100 characters remaining</p>
    <button id="reset-button" type="button">Reset</button>
  </main>
</body>
</html>
