<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Product List Manager</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Product List Manager</h1>
    <form id="product-form">
      <input id="product-input" type="text" placeholder="Enter product name" autocomplete="off">
      <button type="submit">Add Product</button>
    </form>
    <p id="message" aria-live="polite"></p>
    <ul id="product-list"></ul>
    <small>Tip: Click Edit to change a name. Clicking outside the edited item saves it.</small>
  </main>
</body>
</html>
